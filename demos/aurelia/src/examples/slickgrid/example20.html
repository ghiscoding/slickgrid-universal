<div id="demo-container" class="container-fluid">
  <h2>
    Example 20: Pinned Columns/Rows
    <button class="ms-2 btn btn-outline-secondary btn-sm btn-icon" click.trigger="toggleSubTitle()" data-test="toggle-subtitle">
      <span class="mdi mdi-information-outline"></span>
    </button>
  </h2>
  <div class="subtitle">
    This example demonstrates the use of Pinned (aka pinned) Columns and/or Rows (<a
      href="https://ghiscoding.gitbook.io/slickgrid-aurelia/grid-functionalities/pinning"
      target="_blank"
      >Wiki docs</a
    >) City of Origin is intentionally non-pinnable and is highlighted with a subtle pink background.
  </div>
  <div class="row gx-2 mb-2 align-items-end">
    <div class="col-auto">
      <label>Pinned Rows (top/bottom): </label>
      <select
        class="form-select form-select-sm d-inline-block w-auto pinned-top-row-count"
        value.bind="pinnedTopRowCount"
        change.trigger="changePinnedRowCount($event.target.value, 'top')"
      >
        <option repeat.for="count of [0, 1, 2, 3, 4, 5]" model.bind="count">${count}</option>
      </select>
      <select
        class="form-select form-select-sm d-inline-block w-auto pinned-bottom-row-count"
        value.bind="pinnedBottomRowCount"
        change.trigger="changePinnedRowCount($event.target.value, 'bottom')"
      >
        <option repeat.for="count of [0, 1, 2, 3, 4, 5]" model.bind="count">${count}</option>
      </select>
    </div>
    <div class="col-auto">
      <label>Pinned Columns (left/right): </label>
      <select
        class="form-select form-select-sm d-inline-block w-auto pinned-left-column-count"
        value.bind="pinnedColumnCount"
        change.trigger="changePinnedColumnCount($event.target.value, 'left')"
      >
        <option model.bind="-1">None</option>
        <option repeat.for="count of [0, 1, 2, 3, 4, 5]" model.bind="count">${count}</option>
      </select>
      <select
        class="form-select form-select-sm d-inline-block w-auto pinned-right-column-count"
        value.bind="pinnedRightColumnCount"
        change.trigger="changePinnedColumnCount($event.target.value, 'right')"
      >
        <option repeat.for="count of [0, 1, 2]" model.bind="count">${count}</option>
      </select>
    </div>
  </div>
  <div class="row mb-2">
    <div class="col-12">
      <button
        class="btn btn-outline-secondary btn-sm btn-icon"
        click.trigger="setPinnedColumns(-1)"
        data-test="remove-pinned-column-button"
      >
        Remove Pinned Columns
      </button>
      <button
        class="btn btn-outline-secondary btn-sm btn-icon mx-1"
        click.trigger="setPinnedColumns(2, pinnedRightColumnCount)"
        data-test="set-3pinned-columns"
      >
        Pin 3 Columns
      </button>
      <button class="btn btn-outline-secondary btn-sm btn-icon mx-1" click.trigger="toggleRightPinning()" data-test="toggle-pinned-right">
        Toggle Pinned Right
      </button>
      <button class="btn btn-outline-secondary btn-sm btn-icon mx-1" click.trigger="toggleSelectAllRow()" data-test="toggle-select-all-row">
        Toggle Select All
      </button>
      <button
        class="btn btn-outline-secondary btn-sm btn-icon mx-1"
        click.trigger="setLargePinnedColumns()"
        data-test="set-large-pinned-columns"
      >
        Set Large Columns
      </button>
    </div>
  </div>
  <hr />
  <aurelia-slickgrid
    grid-id="grid20"
    columns.bind="columns"
    options.bind="gridOptions"
    dataset.bind="dataset"
    on-validation-error.trigger="onCellValidationError($event.detail.eventData, $event.detail.args)"
    on-aurelia-grid-created.trigger="aureliaGridReady($event.detail)"
  ></aurelia-slickgrid>
</div>
