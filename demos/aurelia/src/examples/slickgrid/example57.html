<div id="demo-container" class="container-fluid">
  <h2>
    Example 57: RTL (Right-to-Left)
    <span class="float-end">
      <a
        style="font-size: 18px"
        target="_blank"
        href="https://github.com/ghiscoding/slickgrid-universal/blob/master/demos/aurelia/src/examples/slickgrid/example57.ts"
      >
        <span class="mdi mdi-link-variant"></span> code
      </a>
    </span>
  </h2>

  <div class="subtitle">
    RTL with dynamic two-sided column pinning, sticky columns, pinned rows, and a colspan crossing the leading pinned boundary
  </div>

  <div class="rtl-controls" style="display: flex; align-items: center; gap: 12px; margin: 8px 0">
    <label
      >Pinned at the start (right) edge:
      <input type="number" id="pinnedStartColumns" min="0" max="16" value="2" />
    </label>
    <label
      >Pinned at the end (left) edge:
      <input type="number" id="pinnedEndColumns" min="0" max="16" value="1" />
    </label>
    <button class="btn btn-outline-secondary btn-sm btn-icon" id="setPinning" type="button" click.trigger="applyPinning()">Apply</button>
    <button class="btn btn-outline-secondary btn-sm btn-icon" id="clearPinning" type="button" click.trigger="clearPinning()">
      Remove pinning
    </button>
  </div>

  <div dir="rtl">
    <aurelia-slickgrid
      grid-id="grid57"
      columns.bind="columns"
      options.bind="gridOptions"
      dataset.bind="dataset"
      on-aurelia-grid-created.trigger="aureliaGridReady($event.detail)"
    ></aurelia-slickgrid>
  </div>
</div>
