packages:
  - demos/**
  - frameworks/**
  - frameworks-plugins/**
  - packages/**
  - '!**/dist/**'

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  cypress: false
  esbuild: false
  lmdb: false
  msgpackr-extract: false

catalog:
  '@4tw/cypress-drag-drop': ^2.3.1
  '@angular-eslint/eslint-plugin': ^22.8.0
  '@faker-js/faker': ^10.6.0
  '@fnando/sparkline': ^0.3.10
  '@formkit/tempo': ^1.6.0
  '@popperjs/core': ^2.11.8
  '@types/fnando__sparkline': ^0.3.7
  '@types/node': ^26.6.7
  '@types/react': ^19.3.1
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.3.0
  '@vitejs/plugin-vue': ^6.0.11
  '@vitest/coverage-v8': ^5.1.1
  '@vitest/ui': ^5.1.1
  autoprefixer: ^10.7.0
  bootstrap: ^5.3.9
  cross-env: ^10.1.0
  cssnano: ^9.9.0
  cypress: ^16.3.0
  cypress-real-events: ^1.15.1
  dequal: ^2.0.3
  dompurify: ^3.5.0
  globals: ^17.14.0
  i18next: ^26.7.2
  i18next-vue: ^5.4.0
  jsdom: ^31.0.1
  jsdom-global: ^3.0.2
  jspdf: ^4.2.1
  multiple-select-vanilla: ^5.2.6
  native-copyfiles: ^2.1.3
  npm-run-all2: ^9.1.0
  oxlint: ^1.95.0
  postcss: ^8.5.33
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.3
  remove-glob: ^1.2.4
  rxjs: ^7.8.2
  sass: ^1.108.2
  svelte: ^5.59.1
  svelte-check: ^4.7.8
  tslib: ^2.9.1
  typescript: ^6.0.3
  vite: ^8.3.8
  vitest: ^5.1.1
  vue: ^3.5.46

# min age of 3 days in minutes (x * 24 * 60)
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # exclude packages that I personally maintain and are safe to use on the same day
  - '@lerna-lite/*'
  - '@excel-builder-vanilla/types'
  - 'excel-builder-vanilla'
  - 'multiple-select-vanilla'

overrides:
  fast-uri: ^4.2.4
  http-cache-semantics: ^4.3.0
  ip-address: ^10.7.6
  minimatch: ^11.0.9
  picomatch: ^4.0.7
  postcss-selector-parser: ^7.2.1
  shell-quote: ^1.12.0
  source-map-js: ^1.2.4
  systeminformation: ^5.33.26
  sprintf-js: ^1.1.3
  undici: ^7.30.2
  vite: 'catalog:'
  zod: ^4.6.7
