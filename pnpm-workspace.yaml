packages:
  - demos/**
  - frameworks/**
  - frameworks-plugins/**
  - packages/**
  - '!**/dist/**'

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  cypress: false
  esbuild: false
  lmdb: false
  msgpackr-extract: false

catalog:
  '@4tw/cypress-drag-drop': ^2.3.1
  '@angular-eslint/eslint-plugin': ^21.4.0
  '@faker-js/faker': ^10.6.0
  '@fnando/sparkline': ^0.3.10
  '@formkit/tempo': ^1.1.0
  '@popperjs/core': ^2.11.8
  '@types/fnando__sparkline': ^0.3.7
  '@types/node': ^24.13.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@types/sortablejs': ^1.15.9
  '@vitejs/plugin-react': ^6.0.5
  '@vitejs/plugin-vue': ^6.0.8
  '@vitest/coverage-v8': ^4.1.11
  '@vitest/ui': ^4.1.11
  bootstrap: ^5.3.8
  cross-env: ^10.1.0
  cypress: ^15.21.0
  cypress-real-events: ^1.15.0
  dequal: ^2.0.3
  dompurify: ^3.4.13
  globals: ^17.11.0
  i18next: ^25.10.10
  i18next-vue: ^5.4.0
  jsdom: ^29.1.1
  jsdom-global: ^3.0.2
  jspdf: ^4.2.1
  multiple-select-vanilla: ^5.2.2
  native-copyfiles: ^2.0.3
  npm-run-all2: ^9.0.3
  oxlint: ^1.79.0
  react: ^19.2.8
  react-dom: ^19.2.8
  react-router: ^8.3.0
  remove-glob: ^1.2.1
  rxjs: ^7.8.2
  sass: ^1.102.0
  sortablejs: ^1.15.7
  tslib: ^2.8.1
  typescript: ^6.0.3
  vite: ^8.2.1
  vitest: ^4.1.11
  vue: ^3.5.41

minimumReleaseAge: 2880 # 2 days in minutes

minimumReleaseAgeExclude:
  # exclude packages that I personally maintain and are safe to use on the same day
  - '@lerna-lite/*'
  - '@excel-builder-vanilla/types'
  - 'excel-builder-vanilla'
  - 'multiple-select-vanilla'

overrides:
  '@babel/core': ^7.29.7
  '@hono/node-server': ^2.1.1
  esbuild: ^0.28.2
  hono: ^4.13.2
  ip-address: ^10.5.0
  minimatch: ^10.2.6
  picomatch: ^4.0.5
  postcss: ^8.5.26
  qs: ^6.15.3
  undici: '^7.29.0'
  vite: 'catalog:'
