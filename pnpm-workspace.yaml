packages:
  - demos/**
  - frameworks/**
  - frameworks-plugins/**
  - packages/**
  - '!**/dist/**'

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  cypress: false
  esbuild: false
  lmdb: false
  msgpackr-extract: false

catalog:
  '@4tw/cypress-drag-drop': ^2.3.1
  '@angular-eslint/eslint-plugin': ^21.4.0
  '@faker-js/faker': ^10.6.0
  '@fnando/sparkline': ^0.3.10
  '@formkit/tempo': ^1.1.0
  '@popperjs/core': ^2.11.8
  '@types/fnando__sparkline': ^0.3.7
  '@types/node': ^24.19.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/sortablejs': ^1.15.9
  '@vitejs/plugin-react': ^6.1.2
  '@vitejs/plugin-vue': ^6.0.9
  '@vitest/coverage-v8': ^5.0.3
  '@vitest/ui': ^5.0.3
  bootstrap: ^5.3.8
  cross-env: ^10.1.0
  cypress: ^15.21.1
  cypress-real-events: ^1.15.1
  dequal: ^2.0.3
  dompurify: ^3.4.16
  globals: ^17.13.0
  i18next: ^25.10.10
  i18next-vue: ^5.4.0
  jsdom: ^29.1.1
  jsdom-global: ^3.0.2
  jspdf: ^4.2.1
  multiple-select-vanilla: ^5.2.3
  native-copyfiles: ^2.1.1
  npm-run-all2: ^9.0.3
  oxlint: ^1.87.0
  postcss: ^8.5.28
  react: ^19.3.0
  react-dom: ^19.3.0
  react-router: ^8.4.0
  remove-glob: ^1.2.3
  rxjs: ^7.8.2
  sass: ^1.105.1
  sortablejs: ^1.15.7
  tslib: ^2.8.1
  typescript: ^6.0.3
  vite: ^8.3.2
  vitest: ^5.0.3
  vue: ^3.5.43

minimumReleaseAge: 2880 # 2 days in minutes

minimumReleaseAgeExclude:
  # exclude packages that I personally maintain and are safe to use on the same day
  - '@lerna-lite/*'
  - '@excel-builder-vanilla/types'
  - 'excel-builder-vanilla'
  - 'multiple-select-vanilla'

overrides:
  '@babel/core': ^7.29.7
  '@hono/node-server': ^2.1.3
  esbuild: ^0.28.2
  fast-uri: ^4.2.1
  hono: ^4.13.13
  ip-address: ^10.7.3
  minimatch: ^10.2.6
  picomatch: ^4.0.7
  qs: ^6.16.0
  svgo: ^4.1.0
  undici: ^7.30.0
  vite: 'catalog:'
