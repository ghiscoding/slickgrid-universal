<div id="demo-container" class="container-fluid">
  <h2>
    Example 57: RTL (Right-to-Left)
    <span class="float-end">
      <a
        style="font-size: 18px"
        target="_blank"
        href="https://github.com/ghiscoding/slickgrid-universal/blob/master/frameworks/angular-slickgrid/src/demos/examples/example57.component.ts"
      >
        <span class="mdi mdi-link-variant"></span> code
      </a>
    </span>
  </h2>
  <div class="subtitle">
    RTL with dynamic two-sided column pinning, sticky columns, pinned rows, and a colspan crossing the leading pinned boundary
  </div>

  <div class="rtl-controls" dir="ltr" style="display: flex; align-items: center; gap: 12px; margin: 8px 0">
    <label
      >Pinned at the start (right) edge:
      <input type="number" id="pinnedStartColumns" min="0" max="16" value="2" />
    </label>
    <label
      >Pinned at the end (left) edge:
      <input type="number" id="pinnedEndColumns" min="0" max="16" value="1" />
    </label>
    <button id="setPinning" type="button" (click)="applyPinning()">Apply</button>
    <button id="clearPinning" type="button" (click)="clearPinning()">Remove pinning</button>
  </div>

  <div dir="rtl">
    <angular-slickgrid
      gridId="grid57"
      [columns]="columns"
      [options]="gridOptions"
      [dataset]="dataset"
      (onAngularGridCreated)="angularGridReady($event.detail)"
    ></angular-slickgrid>
  </div>
</div>
