name: Framework Tests - Svelte

on:
  push:
    branches:
      - master
      - next
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - '!.github/workflows/ci.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        platform:
          - ubuntu-latest

    name: '${{matrix.platform}} / Node ${{ matrix.node }}'
    runs-on: ${{matrix.platform}}
    timeout-minutes: 30
    if: ${{ !startsWith(github.event.head_commit.message, 'docs:') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          install: false

      - name: Set NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - run: pnpm --version

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Build Slickgrid-Universal packages
        run: pnpm build:universal

      - name: Slickgrid-Svelte Framework Build
        run: pnpm svelte:build:framework

      - name: Slickgrid-Svelte Framework-Plugins Build
        run: pnpm svelte:build:framework-plugins

      - name: Website Dev Build (served for Cypress)
        run: pnpm svelte:build:demo

      - name: Ensure Cypress binary is installed
        run: pnpm exec cypress install

      - name: Start HTTP Server
        run: pnpm svelte:serve &

      - name: Run Cypress E2E tests in Chrome
        working-directory: demos/svelte
        run: |
          for spec in test/cypress/e2e/*.cy.ts; do
            case "$spec" in
              *example33.cy.ts|*example43.cy.ts|*example45.cy.ts) continue ;;
            esac
            pnpm exec cypress run --config-file test/cypress.config.ts --spec "$spec" --browser chrome
          done
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          Cypress_extended: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: cypress-screenshots
          path: demos/svelte/test/cypress/screenshots
